# Continual Pre-Training (CPT) Configuration
# Used for injecting raw factual knowledge into the base model.
# Utilizes packing and high-rank rsLoRA for maximum knowledge absorption.

model:
  name_or_path: "google/gemma-3-1b-it"
  use_unsloth: true
  load_in_4bit: true

lora:
  r: 128
  lora_alpha: 256
  use_rslora: true
  lora_dropout: 0.0
  bias: "none"
  target_modules: 
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  task_type: "CAUSAL_LM"

training:
  output_dir: "./outputs/cpt_agrilm"
  num_train_epochs: 3
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  optim: "paged_adamw_8bit"
  learning_rate: 2.0e-5
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.1
  max_grad_norm: 0.3
  save_strategy: "epoch"
  logging_steps: 10
  fp16: false
  bf16: true

data:
  dataset_text_field: "text"
  max_length: 8192
  packing: true  # CRITICAL for CPT to maximize context window usage
